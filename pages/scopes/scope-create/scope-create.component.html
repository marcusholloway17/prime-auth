<div class="px-4">
  <ng-container *ngIf="scopeService$.loadingState$ | async as loader_state">
    <div class="flex lg:justify-content-between">
      <div>
        <div class="flex">
          <p-button icon="pi pi-arrow-left" styleClass="mr-2" link [routerLink]="['/auth', 'manage', 'scopes']" link />
          <div class="font-medium text-3xl text-900 mb-3">Permissions</div>
        </div>
        <div class="text-500 mb-5">Remplisseez le formulaire ci-dessous pour ajouter une permission</div>
      </div>

      <p-button label="Enregistrer" icon="pi pi-save" type="submit" class="w-auto mt-3"
        [disabled]="!(scope.label && scope.slug)" [loading]="loader_state.create" (click)="save($event)" />
    </div>

    <p-card>
      <div class="grid formgrid fluid">
        <div class="field mb-4 col-12">
          <label for="slug" class="font-medium text-900">Slug<span class="required-field">*</span>
          </label>
          <input id="slug" type="text" pInputText [fluid]="true" required="true" [(ngModel)]="scope.slug" autofocus>
        </div>
        <div class="field mb-4 col-12">
          <label for="label" class="font-medium text-900">Libellé<span class="required-field">*</span>
          </label>
          <input id="label" type="text" pInputText [fluid]="true" required="true" [(ngModel)]="scope.label" autofocus>
        </div>
        <div class="field col-12 md:col-12">
          <label for="description" class="font-medium text-900">Description</label>
          <textarea id="description" pTextarea rows="5" [autoResize]="true" [(ngModel)]="scope.description"
            [fluid]="true"></textarea>
        </div>
      </div>
    </p-card>
  </ng-container>
</div>
